name: fast compatibility checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install normal supported dependencies
        run: python -m pip install . black==26.3.1
      - name: Check changed test formatting
        run: python -m black --check tests/test_hash_compatibility.py tests/test_distribution_metadata.py
      - name: Run fast offline cache compatibility contracts
        run: |
          python -m unittest discover -s tests -p test_hash_compatibility.py -v
          python -m unittest discover -s tests -p test_distribution_metadata.py -v
